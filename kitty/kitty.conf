font_family    Monofoki Nerd Font
font_size      11
# text_composition_strategy legacy
modify_font    cell_height 120%
cursor_shape   beam

window_padding_width 10
window_border_width 1
hide_window_decorations yes
placement_strategy center
inactive_text_alpha 0.6
open_url_with   default
scrollback_pager kitty-find INPUT_LINE_NUMBER
enable_audio_bell no
enabled_layouts vertical
confirm_os_window_close 2

# map ctrl+r      load_config_file
map escape combine : clear_selection : send_key escape
map ctrl+c      copy_or_interrupt
map ctrl+v      paste_from_clipboard
map alt+n       new_window
map alt+q       close_window

map alt+1       first_window
map alt+2       second_window
map alt+3       third_window
map alt+4       fourth_window
map alt+5       fifth_window

map ctrl+q signal_child SIGTERM
map ctrl+x signal_child SIGINT
map delete clear_terminal reset active
map alt+[ resize_window narrower 3
map alt+] resize_window wider 3
map alt+shift+] resize_window taller 3
map alt+shift+[ resize_window shorter 3

map alt+tab next_window
map alt+shift+tab previous_window
map alt+j neighboring_window left
map alt+l neighboring_window right
map alt+i neighboring_window up
map alt+k neighboring_window down

map alt+shift+i move_window up
map alt+shift+j move_window left
map alt+shift+l move_window right
map alt+shift+k move_window down

map ctrl+up scroll_home
map ctrl+down scroll_end
map ctrl+f show_scrollback

map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

wheel_scroll_multiplier 3
touch_scroll_multiplier 3
mouse_hide_wait -1
