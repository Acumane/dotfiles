general {
    immediate_render = yes
    ignore_empty_input = yes
    hide_cursor = yes
    grace = 1
}

auth {
    fingerprint:enabled = yes
}

animations {
    animation = fade, 0, 1, default
    animation = inputFieldColors, 1, 4, default
}

$b    = 0B0414
$ol   = 0E0B1C
$bg   = 14141F
$fg   = CFCAAF
$pri  = B8BFE0
$trim = 222235
$fail = EA6F64

background {
    monitor = 
    color = rgb($b)
    zindex = -1
}

# Mask/blank out DP-3
background {
    monitor = DP-3
    zindex = 999
    color = rgb($b)
}

label { # date
    monitor =
    text = cmd[update:10000] echo "$(date +'%a,    %b %-d')"
    color = rgb($fg)
    font_size = 24
    font_family = Inter Medium
    position = 70, -60
    valign = top
    halign = left
}

label { # clock
    monitor =
    text = cmd[update:1000] echo "$(date +'%-I  %M')"
    color = rgb($pri)
    font_size = 200
    font_family = Space Grotesk Light
    position = 50, -45
    valign = top
    halign = left
    zindex = 3
}

$hack = <span foreground='##$b01'>$(date +"%-I")</span><span size='90%'>.</span>
label { # clock "dot"
    monitor =
    text = cmd[update:1000] [ $(($(date +%s) % 2)) -eq 0 ] && echo "$hack"
    color = rgb($pri)
    font_size = 200
    font_family = Space Grotesk Light
    position = 88, 38
    valign = top
    halign = left
    zindex = 2
}

label { # 󱅞⠀icon
    monitor =
    text = ⠀󱅞⠀
    color = rgb($fg)
    font_size = 16
    font_family = mono
    position = -104, -438
    valign = center
    halign = center
    zindex = 2
}

shape { # 󱅞⠀bg mask
    monitor =
    color = rgb($bg)
    size = 46, 33
    rounding = -1
    position = -101, -438
    valign = center
    halign = center
    zindex = 2
}

shape { # 󱅞⠀divider
    monitor =
    color = rgb($trim)
    size = 1, 20
    rounding = -1
    position = -79, -438
    valign = center
    halign = center
    zindex = 2
}

shape { # trim (> than border_)
    monitor =
    color = rgb($trim)
    size = 252, 37
    rounding = -1
    position = 0, -438
    valign = center
    halign = center
    zindex = 1
}

input-field {
    monitor =
    fade_on_empty = false
    size = 250, 35
    dots_size = 0.2
    dots_spacing = 0.8
    outline_thickness = 2
    dots_center = true
    font_color = rgb($fg)
    placeholder_text = 
    fail_timeout = 1000
    fail_text =
    position = 0, -438
    valign = center
    halign = center

    outer_color = 0 # shape
    inner_color = rgb($bg)
    check_color = 0
    fail_color = rgb($fail)
    zindex = 1
}
