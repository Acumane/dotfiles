general {
    immediate_render = yes
    ignore_empty_input = yes
    hide_cursor = yes
    grace = 1
}

auth {
    fingerprint:enabled = yes
}

animations {
    animation = fade, 0, 1, default
}

$b    = 0A0815
$bg   = 14141F
$fg   = CFCAAF
$trim = 222235
$fail = EA6F64

$pri = 220, 215, 186 #DCD7BA
$dim = 152, 152, 255 #9898FF

background {
    monitor = 
    color = rgb($b)
}

label { # date
    monitor =
    text = cmd[update:10000] echo "$(date +'%a,    %b %-d')"
    color = rgb($fg)
    font_size = 24
    font_family = Inter Medium
    position = 70, -60
    valign = top
    halign = left
}

label { # clock
    monitor =
    text = cmd[update:1000] echo "$(date +"%-I  %M")"
    color = rgb($pri)
    font_size = 200
    font_family = Space Grotesk Light
    position = 50, -50
    valign = top
    halign = left
    zindex = 1
}

$hack = <span foreground='##$b01'>$(date +"%-I")</span><span size='90%'>.</span>
label { # clock "dot"
    monitor =
    text = cmd[update:1000] [ $(($(date +%s) % 2)) -eq 0 ] && echo "$hack"
    color = rgb($pri)
    font_size = 200
    font_family = Space Grotesk Light
    position = 92, 25
    valign = top
    halign = left
}

label { # temp
    monitor =
    text = cmd[update:1000] echo "$(sh $SCRIPTS/weather.sh \$1)"
    color = rgb($fg)
    font_size = 36
    font_family = Inter
    position = 70, -350
    valign = top
    halign = left
}

label { # weather status
    monitor =
    text = cmd[update:1000] echo "$(sh $SCRIPTS/weather.sh \$2)"
    color = rgb($fg)
    font_size = 14
    position = 154, -357
    valign = top
    halign = left
}

label { # network
    monitor =
    text = cmd[update:1000] echo "$(python $SCRIPTS/net.py)⠀"
    color = rgb($fg)
    font_size = 24
    font_family = JetBrainsMono Nerd Font
    position = -40, -60
    valign = top
    halign = right
}

label { # 󱅞⠀icon
    monitor =
    text = ⠀󱅞⠀
    color = rgb($fg)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = -104, -438
    valign = center
    halign = center
    zindex = 2
}

shape { # 󱅞⠀bg mask
    monitor =
    color = rgb($bg)
    size = 46, 33
    rounding = -1
    position = -101, -438
    valign = center
    halign = center
    zindex = 1
}

shape { # 󱅞⠀divider
    monitor =
    color = rgb($trim)
    size = 1, 20
    rounding = -1
    position = -79, -438
    valign = center
    halign = center
    zindex = 1
}

shape { # trim (> than border_)
    monitor =
    color = rgb($trim)
    size = 252, 37
    rounding = -1
    position = 0, -438
    valign = center
    halign = center
    zindex = -1
}

input-field {
    monitor =
    fade_on_empty = false
    size = 250, 35
    dots_size = 0.2
    dots_spacing = 0.8
    outline_thickness = 2
    dots_center = true
    font_color = rgb($fg)
    placeholder_text = 
    fail_timeout = 1000
    fail_text =
    position = 0, -438
    valign = center
    halign = center

    outer_color = 0 # shape
    inner_color = rgb($bg)
    check_color = 0
    fail_color = rgb($fail)
}

label { # system
    monitor =
    text = cmd[update:0] echo "$(hostname) $(uname -r | cut -d'-' -f1)"
    color = rgba($dim, 0.125)
    font_size = 10
    font_family = VCR OSD Mono
    position = 0, 50
    valign = bottom
    halign = center
}
