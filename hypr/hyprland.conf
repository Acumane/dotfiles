source = $DOTS/hypr/$DEV_TYPE.conf

exec-once = keyd-application-mapper -d
exec-once = wl-paste --watch cliphist store
exec-once = hyprpm reload && hyprctl dismissnotify
exec-once = /usr/libexec/polkit-gnome-authentication-agent-1
exec-once = swayosd-server -s $DOTS/sway/osd.css
exec-once = hyprlock
exec-once = adb start-server
exec-once = firefox & code & sleep 2s && kitty
exec-once = syncthing serve --no-browser
exec-once = sudo tailscale up --operator=$USER
exec-once = wlsunset -S 8:00 -s 22:00 -t 3500 -d 1800
exec-once = play -q $HOME/audio/sounds/greet.flac &
exec-once = swaybg -c "##0A0815"
# exec-once = $SCRIPTS/use-mic.sh
# exec-once = $SCRIPTS/ov.sh
# exec-once = songs

$active    = 3F3F50
$inactive  = 2A2A37
$bright    = 595970
$dim       = 32323D
$shadow    = 0A00102A
$warn      = E67B7F

general {
    border_size = 1
    # sensitivity = 1.0
    resize_on_border = yes
    extend_border_grab_area = 10
    col.active_border = rgb($active)
    col.inactive_border = rgb($inactive)
    col.nogroup_border_active = rgb($warn)

    layout = scroller
}

# render:direct_scanout = yes

input {
    scroll_factor = 1.25
    focus_on_close = 1
    touchpad {
        natural_scroll = yes
        scroll_factor = 0.6
        # drag_lock = yes
        tap-and-drag = no
    }
}

binds {
    focus_preferred_method = 1
    allow_pin_fullscreen = yes
}

cursor:persistent_warps = yes

plugin {
    hyprwinwrap {
        class = bg
    }
    dynamic-cursors {
        enabled = true
        mode = tilt
        threshold = 2

        shake { 
            enabled = false
        }
    }
    scroller {
        column_widths = $widths
        window_heights = $heights
        gesture_scroll_distance = 50
        # gesture_overview_enable = false
        gesture_workspace_switch_prefix = r
        jump_labels_keys = asdfjkl
        jump_labels_scale = 0.2
        cyclesize_wrap = no
        focus_edge_ms = 200
        focus_wrap = no
    }
}

decoration {
    rounding = 10
    dim_around = 0.45
    shadow {
        range = 45
        render_power = 4
        color = rgba($shadow)
        offset = 0 4
    }
    blur {
        enabled = no
    }
}

animations {
    enabled = yes
    animation = windowsIn,  1, 3, default, slide
    animation = windowsOut, 1, 3, default, slide

    animation = fade,    1, 2, default
    animation = border,  1, 3, default

    animation = layers,      1, 1.5, default, slide
    animation = windowsMove, 1, 3,   default, slide
    animation = workspaces,  1, 4,   default, slide
    animation = specialWorkspace,  1, 4, default, slidevert
}

misc {
    disable_hyprland_logo = yes
    disable_splash_rendering = yes
    key_press_enables_dpms = yes
    focus_on_activate = yes
    animate_manual_resizes = yes
    enable_anr_dialog = no
}
ecosystem {
    no_update_news = yes
    no_donation_nag = yes
}

# TODO: swayosd-libinput-backend (broken)
bind = , XF86AudioMute, exec, $SCRIPTS/amute.sh -t
binde = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume +5 
binde = , XF86AudioLowerVolume, exec, swayosd-client --output-volume -5 
bind = , XF86AudioPlay, exec, $SCRIPTS/player.sh
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86AudioNext, exec, playerctl next

bind = SUPER, slash, exec, raise -c "kitty" -e "kitty"
bind = SUPER SHIFT, slash, exec, kitty
bind = SUPER, equal, exec, hyprpicker -a
bind = SUPER, W, exec, raise -c "org.mozilla.firefox" -e "firefox"
bind = SUPER SHIFT, W, exec, firefox
bind = SUPER, E, exec, raise -c "org.gnome.Nautilus" -e "nautilus"
bind = SUPER SHIFT, E, exec, nautilus

bind = SUPER, Q, killactive
# bind = SUPER, U, exec, $SCRIPTS/safe-quit.sh -u
bind = SUPER, delete, exec, hyprctl kill
bind = SUPER, F, fullscreen 
# bindr = SUPER CTRL, SUPER_L, togglefloating
bind = SUPER, A, exec, flatpak run com.saivert.pwvucontrol
bind = SUPER, space, exec, grimblast --notify --freeze copy area
bind = SUPER SHIFT, space, exec, grimrec gif area save
bind = SUPER, grave, exec, flatpak run net.nokyan.Resources
bind = SUPER, h, exec,flatpak run io.github.nokse22.inspector
bind = SUPER, X, sendshortcut, ALT, X, class:(.*firefox)
bind = SUPER, X, sendshortcut, ALT, X, class:(code)
bindr = SUPER, Super_L, exec, $SCRIPTS/menu.sh run
bind = SUPER, period, exec, $SCRIPTS/menu.sh emoji
bind = SUPER, V, exec, $SCRIPTS/menu.sh copy
bind = SUPER, P, exec, $SCRIPTS/menu.sh copy

bind = SUPER, J, scroller:movefocus, l
bind = SUPER, L, scroller:movefocus, r
bind = SUPER, I, scroller:movefocus, u
bind = SUPER, K, scroller:movefocus, d

bind = SUPER SHIFT, J, exec, $SCRIPTS/swap l
bind = SUPER SHIFT, L, exec, $SCRIPTS/swap r
bind = SUPER SHIFT, I, exec, $SCRIPTS/swap u
bind = SUPER SHIFT, K, exec, $SCRIPTS/swap d

bind = SUPER, left,   scroller:movewindow, l, nomode # M+C+j
bind = SUPER, right,  scroller:movewindow, r, nomode # M+C+l
bind = SUPER, return, scroller:fitsize, visible
$S   = hyprctl dispatch scroller
bind = SUPER, M, exec, $S:setwidth $m && $S:setheight 3

bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER SHIFT, 1, movetoworkspacesilent, 1
bind = SUPER SHIFT, 2, movetoworkspacesilent, 2
bind = SUPER SHIFT, 3, movetoworkspacesilent, 3

# bindr = SUPER SHIFT, SUPER_L, exec, $SCRIPTS/setmode

binde = SUPER, bracketleft, scroller:cyclewidth, prev
binde = SUPER, bracketright, scroller:cyclewidth, next
binde = SUPER SHIFT, bracketright, scroller:cycleheight, prev
binde = SUPER SHIFT, bracketleft, scroller:cycleheight, next

bind = SUPER, F9, workspace,  -1 
bind = SUPER, F10, workspace, +1
bind = SUPER SHIFT,  F9, exec, $SCRIPTS/swap S-l
bind = SUPER SHIFT, F10, exec, $SCRIPTS/swap S-r

# Move/resize windows
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow 
bindm = SUPER SHIFT, mouse:273, resizewindow 1

$PiP       = (Picture-in-Picture)
$media     = (mpv|scrcpy|swayimg|.*Loupe|.*Celluloid)
$floater   = (Calculator|Length)
$applets   = .*(Vaults|Recorder|Decibels|pwvu.*|Fragments|Resources|inspector|Amberol|Snapshot)
$popups    = .*(Rofi|$floater|$media|NautilusPreviewer|desktop-portal|share.picker|vaults|turtle).*
$launchers = (battle.net|.*[Ll]auncher).*
$games     = ([Ss]tar[Cc]itizen|Minecraft|overwatch).*

plugin:hyprhook {
    openWindow = $SCRIPTS/game.sh "$games"
    openWindow = $SCRIPTS/float-fix.sh
    closeWindow = $SCRIPTS/ret-ws1.sh
}

windowrule = idleinhibit always, fullscreen:1
windowrule = fullscreen, class:(qemu.*|$games)
windowrule = workspace emptynm, fullscreen:1

# Banish Wine windows to hell, spare the children:
windowrule = workspace name:hell silent, class:(wineboot|explorer|.*error)\.exe # lutris
windowrule = workspace name:hell silent, class:(steam_app_).*, title:() # Proton
windowrule = workspace, onworkspace:name:hell

windowrule = animation popin 80%, floating:1
windowrule = noshadow, floating:0
layerrule    = noanim, hyprpicker
layerrule    = noanim, selection

# smart gaps
workspace = w[tv1], gapsout:1, gapsin:0
workspace = f[1], gapsout:1, gapsin:0

# groups
$not       = negative
$scroller  = plugin:scroller
windowrule = $scroller:group primary, class:(code|.*firefox)
windowrule = $scroller:group secondary, class:(kitty|.*Nautilus)
windowrule = $scroller:group tertiary, class:($applets)

windowrule = $scroller:columnwidth $p_width, class:(code|.*firefox|.*xournalpp|qemu.*)
windowrule = $scroller:columnwidth $t_width, class:($applets|kitty)
windowrule = $scroller:windowheight fiveeighths, class:.*(Resources|inspector)
windowrule = $scroller:windowheight onehalf, class:($applets|.*Nautilus)
windowrule = $scroller:columnwidth one, class:($games)

# fixes
windowrule = float, class:($popups)
windowrule = rounding 12, floating:1 
windowrule = rounding 14, floating:1, class:$not:($popups), title:$not:($PiP)
windowrule = rounding 18, class:(.*Nautilus), title:(()|.+(\?|\.)), floating:1 # > 46
windowrule = rounding 18, title:(), floating:1
windowrule = float, title:(Open|Save)\s.*
windowrule = tile, class:($games)

# popups, floating apps
windowrule = move onscreen cursor 4% 6%, class:(Rofi)
windowrule = bordercolor rgb($active) rgb($dim), floating:1
windowrule = dimaround, floating:1, title:$not:(Launcher|$PiP), class:$not:.*($floater|$launchers|$media)

windowrule = move onscreen cursor -50% -50%, class:.*($floater)
windowrule = bordercolor rgb($bright) rgb($active), class:($media)
windowrule = bordercolor rgb($bright) rgb($active), title:($PiP)

windowrule = minsize 360 225, class:($media)

windowrule = keepaspectratio, class:(scrcpy)
windowrule = maxsize 1080 2400, class:(scrcpy)
windowrule = size 540 1200, class:(scrcpy)
windowrule = center, class:(scrcpy)

windowrule = float, title:($PiP)
windowrule = pin, title:($PiP)
windowrule = noinitialfocus, title:($PiP)
windowrule = keepaspectratio, title:($PiP)
windowrule = size 560 315, title:($PiP)
windowrule = minsize 360 200, title:($PiP)
windowrule = move 100%-620 100%-365, title:($PiP)
