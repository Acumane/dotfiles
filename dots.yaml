- defaults:
    link:
      create: true
      relink: true
      force: true

- clean: ['~']
- clean:
    ~/.config:
        recursive: true
    ~/.local/bin:
        recursive: true

- link:
    ~/.config/nvim/init.vim: nvim/init.vim
    ~/.config/nvim/lua/init.lua: nvim/init.lua
    ~/.config/user-dirs.dirs: misc/user.dirs
    /etc/zshenv:
      path: zsh/zshenv
      type: hardlink
    ~/.config/zsh/.zshrc: zsh/zshrc
    ~/.config/zsh/alias.zsh: zsh/alias.zsh
    /etc/keyd/default.conf: 
      path: keyd/global.conf
      type: hardlink
    ~/.config/hypr:
      glob: true
      path: hypr/*
    ~/.config/home-manager/home.nix: home.nix
    ~/.config/systemd/user/:
      glob: true
      path: systemd/*
    ~/.mozilla/firefox/main/chrome:
      glob: true
      path: firefox/styles/*
    ~/.mozilla/firefox/main/user.js: firefox/user.js
    ~/.config/niri/config.kdl: niri/config.kdl
    ~/.config/keyd/app.conf: keyd/app.conf
    ~/.config/fontconfig/fonts.conf: misc/fontconfig
    ~/.lesskey: misc/lesskey
    ~/.ssh/config: misc/ssh
    ~/.local/bin:
      glob: true
      path: bin/*
    ~/.config/mpv:
      glob: true
      path: mpv/*
    ~/.config/kitty:
      glob: true
      path: kitty/*
    ~/.config/fusuma/config.yml: fusuma/config.yml
    ~/.config/dunst/dunstrc: noti/dunstrc
    ~/.config/sway/osd.css: sway/osd.css
    /var/spool/cron/bren:
      path: noti/crontab
      type: hardlink
    ~/.config/rofi:
      glob: true
      path: rofi/*
    ~/:
      glob: true
      path: git/*
      prefix: '.'

- create:
  - ~/mach

- shell:
  - [ sudo keyd reload, Reloading keyd... ]
  - [ systemctl --user daemon-reload; sudo systemctl daemon-reload, Reloading systemd... ]
